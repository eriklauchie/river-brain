name: City map data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 1 * *'   # first of the month, 06:00 UTC

permissions:
  contents: write
  actions: write

jobs:
  city:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch buildings, parks and roads from OpenStreetMap
        run: node scripts/city.mjs
      - name: Commit if changed
        run: |
          git config user.name "river-brain-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/city.json
          git diff --cached --quiet || git commit -m "City map data refresh"
          git push

      # A push made with the workflow token does not start other workflows, so start the Pages deploy here.
      - name: Publish to Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
