name: Greenway map data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 1 * *'   # first of the month, 07:00 UTC
  push:
    branches: [main]
    paths: ['data/greenway.json']

permissions:
  contents: write
  actions: write

concurrency:
  group: greenway-geo
  cancel-in-progress: true

jobs:
  greenway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch the river, trails and project routes from OpenStreetMap
        run: node scripts/greenway.mjs
      - name: Commit if changed
        run: |
          git config user.name "river-brain-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/greenway-geo.json
          git diff --cached --quiet && exit 0
          git commit -m "Greenway map data refresh"
          git pull --rebase origin main
          git push

      # A push made with the workflow token does not start other workflows, so start the Pages deploy here.
      - name: Publish to Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
